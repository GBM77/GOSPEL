<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3D2F" />
      <stop offset="50%" stop-color="#2D4330" />
      <stop offset="100%" stop-color="#1B281D" />
    </linearGradient>
    <linearGradient id="stream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA" />
      <stop offset="50%" stop-color="#4DD0E1" />
      <stop offset="100%" stop-color="#00ACC1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1" />
      <stop offset="50%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Living Stream Curve (Psalm 1:3) -->
  <path d="M 0 380 Q 140 330, 240 390 T 512 360 L 512 512 L 0 512 Z" fill="url(#stream)" opacity="0.85" />
  <path d="M 0 420 Q 160 380, 270 430 T 512 410 L 512 512 L 0 512 Z" fill="#00838F" opacity="0.6" />

  <!-- Flourishing Tree Beside the Stream -->
  <!-- Tree Trunk & Roots -->
  <path d="M 235 430 Q 256 320, 256 220 Q 256 320, 277 430 Q 260 410, 256 410 Q 252 410, 235 430 Z" fill="#8D6E63" />
  <!-- Roots Drinking Living Waters -->
  <path d="M 235 430 Q 210 460, 180 480 M 277 430 Q 300 460, 330 480 M 256 420 L 256 490" stroke="#8D6E63" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Lush Foliage Canopy (Three Golden-Green Overlapping Clouds) -->
  <circle cx="256" cy="190" r="95" fill="#4CAF50" opacity="0.95" />
  <circle cx="195" cy="225" r="70" fill="#43A047" opacity="0.95" />
  <circle cx="317" cy="225" r="70" fill="#388E3C" opacity="0.95" />
  <circle cx="256" cy="155" r="60" fill="#81C784" opacity="0.9" />

  <!-- Heavenly Sunbeams / Father's Whisper Dove -->
  <path d="M 256 80 L 256 115 M 190 100 L 215 125 M 322 100 L 297 125" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" />

  <!-- Peaceful Golden Cross/Star Accent in Tree -->
  <circle cx="256" cy="190" r="14" fill="url(#gold)" />
  <circle cx="256" cy="190" r="24" stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Small Grace Fruit (按時結果子) -->
  <circle cx="220" cy="180" r="8" fill="#FF8A65" />
  <circle cx="285" cy="195" r="8" fill="#FF8A65" />
  <circle cx="250" cy="245" r="8" fill="#FF8A65" />
  <circle cx="320" cy="240" r="7" fill="#FF8A65" />
</svg>
